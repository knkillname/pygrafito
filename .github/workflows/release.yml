name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Hatch
        run: uv tool install hatch

      - name: Add Hatch to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Hatch environments
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/hatch
          key: release-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Check
        run: hatch check

      - name: Test
        run: hatch test

      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          tag = os.environ["GITHUB_REF_NAME"]
          about = pathlib.Path("src/pygrafito/__about__.py").read_text()
          match = re.search(r'__version__ = "([^"]+)"', about)
          assert match is not None, "no __version__ in __about__.py"
          expected = f"v{match.group(1)}"
          assert tag == expected, f"tag {tag!r} does not match version {expected!r}"
          PY

      - name: Build distributions
        run: uv build

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
