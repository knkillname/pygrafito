name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Install Hatch
        run: uv tool install hatch

      - name: Add Hatch to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Hatch environments
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/hatch
          key: hatch-${{ runner.os }}-py3.14-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            hatch-${{ runner.os }}-py3.14-

      - name: Check
        run: hatch check

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Show SQLite version
        run: |
          version=$(python -c "import sqlite3; print(sqlite3.sqlite_version)")
          expected=$(sed -n 's/^ARG SQLITE_VERSION=//p' docker/Dockerfile)
          echo "SQLite version: $version (Docker pin: $expected)"
          {
            echo "SQLite version: $version"
            echo "Docker pin: $expected"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$version" != "$expected" ]; then
            echo "::warning title=SQLite pin drift::CI runs SQLite $version but docker/Dockerfile pins $expected. Update SQLITE_VERSION and SQLITE_URL in docker/Dockerfile."
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Install Hatch
        run: uv tool install hatch

      - name: Add Hatch to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Hatch environments
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/hatch
          key: hatch-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            hatch-${{ runner.os }}-py${{ matrix.python }}-

      - name: Test
        run: hatch test -py ${{ matrix.python }}

  package:
    name: Package (Python ${{ matrix.python }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ matrix.python }}-

      - name: Build distributions
        run: uv build

      - name: Install wheel
        run: |
          uv venv .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/*.whl

      - name: Smoke test installed wheel
        run: |
          .wheel-smoke/bin/python - <<'PY'
          from pygrafito import Graph

          with Graph.open(":memory:") as graph:
              node = graph.add_node("Program", designation="Tron")
              assert graph.node(node.id)["designation"] == "Tron"
          PY

      - name: Smoke test the installed command
        run: |
          .wheel-smoke/bin/pygrafito --help
          .wheel-smoke/bin/python -m pygrafito --help

      - name: Verify wheel contents
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          assert any(name.endswith("py.typed") for name in names), names
          assert any(name.endswith("LICENSE.txt") for name in names), names
          PY

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Install Hatch
        run: uv tool install hatch

      - name: Add Hatch to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Hatch environments
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/hatch
          key: docs-${{ runner.os }}-py3.14-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            docs-${{ runner.os }}-py3.14-

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache Mermaid CLI
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/puppeteer
          key: mermaid-${{ runner.os }}-${{ hashFiles('docs/conf.py') }}
          restore-keys: |
            mermaid-${{ runner.os }}-

      - name: Build documentation
        run: hatch run docs:build
