[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pygrafito"
dynamic = ["version"]
description = "An embedded property graph backed by the Python standard library"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
keywords = ["graph", "property-graph", "sqlite", "embedded"]
authors = [
  { name = "Mario Abarca", email = "knkillname@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
docs = [
  "sphinx>=9.0",
  "myst-parser>=4.0",
  "furo>=2025.9",
  "sphinx-copybutton>=0.5",
  "sphinx-design>=0.6",
  "sphinx-autobuild>=2024.10",
  "sphinxcontrib-mermaid>=2.1",
]

[project.scripts]
pygrafito = "pygrafito.cli.app:App.main"

[project.urls]
Documentation = "https://knkillname.github.io/pygrafito/"
Issues = "https://github.com/knkillname/pygrafito/issues"
Source = "https://github.com/knkillname/pygrafito"

[tool.hatch.version]
path = "src/pygrafito/__about__.py"

[tool.hatch.envs.hatch-check-types]
extra-dependencies = [
  "hypothesis>=6.0",
]

[tool.hatch.envs.hatch-test]
extra-dependencies = [
  "hypothesis>=6.0",
  "pytest-cov>=6.0",
]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.13", "3.14"]

[tool.hatch.envs.docs]
features = ["docs"]

[tool.hatch.envs.docs.scripts]
build = "sphinx-build -W --keep-going -b html docs docs/_build/html"
serve = "sphinx-autobuild docs docs/_build/html"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = [
  "ANN",
  "ARG",
  "B",
  "C4",
  "D",
  "DTZ",
  "E",
  "F",
  "I",
  "N",
  "PTH",
  "PL",
  "PT",
  "RUF",
  "SIM",
  "TID",
  "UP",
  "W",
]
ignore = [
  "D203",
  "D213",
  "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
"src/pygrafito/engine/query/*.py" = [
  "PLR0911",
  "PLR0912",
  "PLR0915",
]
"tests/**" = [
  "ANN",
  "ARG",
  "D",
  "PLR2004",
]
"examples/extract/*.py" = [
  "PLR0912",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pyrefly]
preset = "strict"
project-includes = ["src/pygrafito", "tests", "examples"]
search-path = ["src", "."]
python-version = "3.13"
disable-search-path-heuristics = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pygrafito --cov-report=term-missing"

[tool.coverage.run]
source = ["pygrafito"]
branch = true
omit = [
  "src/pygrafito/__about__.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
