// 03-compose.gql - UNWIND alias, WITH aggregation, implicit grouping, and MERGE extension.
// Current transitional dialect. UNWIND is an alias for canonical FOR; WITH and implicit grouping
// are pygrafito extensions.

UNWIND [36, 37, 39, 40] AS cycles
RETURN cycles ORDER BY cycles;

UNWIND ['Tron', 'Quorra', 'Ares'] AS name
MATCH (p:Program {designation: name})
RETURN name, p.cycles AS cycles ORDER BY name;

MATCH (entity)-[:APPEARS_IN]->(f:Film)
WITH f.designation AS film, count(*) AS entities
RETURN film, entities ORDER BY entities DESC, film;

MATCH (p:Program)
WITH p.designation AS name, p.cycles AS cycles
WHERE cycles >= 40
RETURN name, cycles ORDER BY name;

.param rows=[{"designation":"Example A","cycles":10},{"designation":"Example B","cycles":11}]

UNWIND $rows AS row
MERGE (p:Program {designation: row.designation})
ON CREATE SET p.cycles = row.cycles
RETURN p.designation AS name, p.cycles AS cycles ORDER BY name;

MATCH (p:Program) WHERE p.designation STARTS WITH 'Example ' DETACH DELETE p;
